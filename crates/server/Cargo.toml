[package]
name = "ambient-forge"
version = "0.1.2"
edition = "2024"
description = "Ambient Forge: Bild und Ton für Rollenspielrunden im lokalen Netzwerk steuern."

[[bin]]
name = "ambient-forge"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
if-addrs = "0.15.0"
mime = "0.3.17"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
